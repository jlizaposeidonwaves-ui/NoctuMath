<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
<style>
.lg-owl{animation:lgBounce 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes lgBounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
.lg-sym{animation:lgFloat 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes lgFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>

<defs><linearGradient id="lgY" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
<g class="lg-ring"><circle cx="70" cy="74" r="62" fill="none" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 7"/></g>
<circle cx="70" cy="76" r="46" fill="url(#lgY)"/>
<g class="lg-owl"><text x="70" y="100" text-anchor="middle" font-size="64">🦉</text></g>
<text class="lg-sym" style="animation-duration:2.4s;animation-delay:0.0s;filter:drop-shadow(0 2px 5px rgba(0,0,0,.65))" x="26" y="42" text-anchor="middle" font-size="24" font-weight="800" fill="#34d399" font-family="Fredoka,Arial">+</text><text class="lg-sym" style="animation-duration:2.75s;animation-delay:0.3s;filter:drop-shadow(0 2px 5px rgba(0,0,0,.65))" x="116" y="48" text-anchor="middle" font-size="36" font-weight="800" fill="#fb923c" font-family="Fredoka,Arial">−</text><text class="lg-sym" style="animation-duration:3.0999999999999996s;animation-delay:0.6s;filter:drop-shadow(0 2px 5px rgba(0,0,0,.65))" x="12" y="106" text-anchor="middle" font-size="34" font-weight="800" fill="#a78bfa" font-family="Fredoka,Arial">×</text><text class="lg-sym" style="animation-duration:3.4499999999999997s;animation-delay:0.8999999999999999s;filter:drop-shadow(0 2px 5px rgba(0,0,0,.65))" x="128" y="106" text-anchor="middle" font-size="34" font-weight="800" fill="#38bdf8" font-family="Fredoka,Arial">÷</text><text class="lg-sym" style="animation-duration:3.8s;animation-delay:1.2s;filter:drop-shadow(0 2px 5px rgba(0,0,0,.65))" x="70" y="26" text-anchor="middle" font-size="30" font-weight="800" fill="#fbbf24" font-family="Fredoka,Arial">=</text></svg>
