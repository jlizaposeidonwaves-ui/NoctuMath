<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Privacy Policy — NoctuMath</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap");
body{font-family:"Inter",system-ui,sans-serif;background:linear-gradient(135deg,#0b1120 0%,#1e1b4b 45%,#082f49 100%);min-height:100vh}
h1{font-family:"Fredoka",sans-serif}
</style>
</head>
<body class="text-slate-200">
<div class="max-w-3xl mx-auto px-6 py-12">
  <a href="/" class="text-amber-300 text-sm font-semibold hover:underline">← Back to NoctuMath</a>
  <h1 id="t" class="text-3xl font-bold text-white mt-6 mb-8"></h1>
  <div id="body" class="space-y-4 text-[14px] leading-relaxed pb-16"></div>
</div>
<script>
const LEGAL_DOCS={
 privacy:{title:"Privacy Policy — NoctuMath",body:[
  ["Last updated: October 2026","NoctuMath (“we”, “us”) is a math practice app for children in grades K–8. This policy explains what we collect, why, and the rights of parents and guardians."],
  ["1. The short version","Student answers, stars, streaks and notes are stored <b>locally on your device</b> (and in the future, under your parent account in the cloud). We do not sell data, we do not show behavioral ads, and we never track children across other websites."],
  ["2. What we collect","• Student profiles (first name or nickname chosen by the parent)<br/>• Practice activity: which problems were solved, right or wrong, and when<br/>• Parent contact email (if provided, for receipts and progress reports)<br/>• Payment details — handled entirely by our payment processor (Lemon Squeezy, our Merchant of Record); we never see or store card numbers."],
  ["3. Children’s privacy (COPPA)","NoctuMath is designed for children under 13 and complies with the Children’s Online Privacy Protection Act. Children cannot create accounts or provide personal information — only a parent or guardian can. We collect only the minimum needed to provide the service, and parents may review, correct or delete their child’s data at any time by contacting us."],
  ["4. How we use information","To run the app (saving progress, showing the parent dashboard), to send transactional emails parents request, and to improve the product. We never use student data for advertising or profiling."],
  ["5. Cookies & local storage","We use strictly-necessary storage to keep the site working (profiles, preferences, consent choice). We do not use third-party tracking, analytics advertising cookies, or fingerprinting. You can decline non-essential storage via the cookie banner."],
  ["6. Data retention & deletion","Data is kept while the parent keeps the profile. Parents can delete a student profile at any time from the app, or email us to delete everything: <b>support@noctumath.com</b>. Deletion is completed within 30 days."],
  ["7. Your rights","Depending on your region (GDPR, CCPA/CPRA), parents may request access, correction, portability or deletion of their child’s data at any time by emailing <b>support@noctumath.com</b>."],
  ["8. Security & changes","Data is encrypted in transit. We may update this policy as features launch (e.g., cloud accounts) — material changes will be announced in-app and by email to registered parents."]]},
 terms:{title:"Terms of Service — NoctuMath",body:[
  ["Last updated: October 2026","By using NoctuMath you agree to these terms. If you use it on behalf of your children, you accept these terms for your whole family."],
  ["1. The service","NoctuMath provides step-by-step math practice (addition, subtraction, multiplication, division) for grades K–8, including quizzes, progress reports and printable worksheets. Features may evolve over time."],
  ["2. Free plan & Parent Plan","The Free plan includes unlimited practice and quizzes up to 10 questions, without saved progress. The <b>Parent Plan</b> ($4.99/month or $39/year) adds saved progress, the Parent Dashboard, Worksheets, Past Problems and quizzes up to 50 questions. Prices may change with 30 days' notice."],
  ["3. Billing & cancellation","Subscriptions bill through our payment processor until canceled. Parents can cancel anytime from <b>Account Settings</b> — access continues until the end of the paid period, and no partial refunds are given except where required by law."],
  ["4. Acceptable use","NoctuMath is for personal, family and classroom use. Don’t scrape, resell, or attempt to disrupt the service; don't upload content you have no rights to."],
  ["5. Children & accounts","Children use NoctuMath under a parent-managed profile. Parents are responsible for supervising use and for the accuracy of the information they provide."],
  ["6. Content & education","NoctuMath is a practice aid, not a certified curriculum or tutoring service. While our step-by-step methods follow standard elementary pedagogy, results depend on each child’s practice."],
  ["7. Intellectual property","The NoctuMath name, owl logo, design and content belong to us. You receive a personal, non-transferable license to use the service."],
  ["8. Liability & changes","The service is provided \"as is\" to the maximum extent permitted by law. We may update these terms; continued use after notice constitutes acceptance. Questions: <b>support@noctumath.com</b>."]]}};
const d=LEGAL_DOCS["privacy"];
document.getElementById("t").textContent=d.title;
document.getElementById("body").innerHTML=d.body.map(s=>`<div class="bg-slate-800/70 border border-slate-700 rounded-2xl p-5"><h3 class="text-white font-bold text-sm mb-1.5">${s[0]}</h3><p class="text-slate-300">${s[1]}</p></div>`).join("");
</script>
</body>
</html>
